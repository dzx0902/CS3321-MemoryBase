issues:
  - id: "I001"
    title: "梳理 MemoryBase 仓库结构与本地启动入口"
    epic: "Epic 1：项目初始化与 GitHub 工程规范"
    priority: "priority: p0"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: chore"
      - "priority: p0"
      - "area: project"
      - "area: docs"
    depends_on: []
    template: "task"
    body: |
      ## 背景
      
      MemoryBase 需要一个可复现的课程项目骨架，保证 README、本地启动、数据库初始化、前后端目录和 demo 数据目录互相一致。
      
      ## 目标
      
      完成仓库结构与本地启动入口的对齐，让新成员可以按 README 跑起 PostgreSQL、后端和前端骨架。
      
      ## 任务清单
      
      - [ ] 对照 README 校验 `backend/`、`frontend/`、`database/`、`docs/`、`scripts/` 与 `data/` 目录说明。
      - [ ] 补齐 `.env.example`、demo 数据目录占位文件和 `data/markdown_wiki/` 导出目录说明。
      - [ ] 在 README 中明确 Docker Compose、SQL 初始化、后端启动、前端启动的顺序。
      
      ## 涉及文件
      
      - `README.md`
      - `.env.example`
      - `docker-compose.yml`
      - `database/README.md`
      - `data/raw_sources/demo_workspace/.gitkeep`
      - `data/markdown_wiki/.gitkeep`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      - `GET /api/health`
      
      ## 验收标准
      
      - [ ] README 中的启动命令与仓库真实目录一致。
      - [ ] demo source 与 wiki export 目录存在或有清晰创建说明。
      - [ ] 新成员可以按文档完成数据库、后端、前端三段启动。
      
      ## 依赖关系
      
      无。
      
      ## 备注
      
      Module 建议：Project / Onboarding。不要引入新框架，重点是让后续 issue 有稳定目录锚点。
      
      ---
  - id: "I002"
    title: "统一 GitHub Issue / PR 模板与协作规则"
    epic: "Epic 1：项目初始化与 GitHub 工程规范"
    priority: "priority: p0"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: chore"
      - "priority: p0"
      - "area: project"
      - "area: docs"
    depends_on: ["I001"]
    template: "task"
    body: |
      ## 背景
      
      项目要求所有任务通过 Issue 和 Pull Request 流转，现有模板需要与课程文档中的 labels、milestones、AI 使用说明保持一致。
      
      ## 目标
      
      在不删除现有模板的前提下，校准 Issue/PR 模板、协作规则和分支保护建议。
      
      ## 任务清单
      
      - [ ] 检查 `.github/ISSUE_TEMPLATE/` 中 `task`、`feature_request`、`bug_report` 的字段是否覆盖目标、任务清单和验收标准。
      - [ ] 更新 `CONTRIBUTING.md` 与 `docs/12-github-workflow.md`，写清 labels、milestones、branch naming、review 要求。
      - [ ] 在 PR 模板中保留数据库影响、测试情况和 AI 使用情况。
      
      ## 涉及文件
      
      - `.github/ISSUE_TEMPLATE/task.yml`
      - `.github/ISSUE_TEMPLATE/feature_request.yml`
      - `.github/ISSUE_TEMPLATE/bug_report.yml`
      - `.github/PULL_REQUEST_TEMPLATE.md`
      - `CONTRIBUTING.md`
      - `docs/12-github-workflow.md`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] Issue 模板字段能承载背景、目标、任务清单、验收标准。
      - [ ] PR 模板要求关联 Issue、说明测试、说明数据库影响。
      - [ ] 文档中明确 main/dev/feature/fix/docs/sql 分支策略和 review 规则。
      
      ## 依赖关系
      
      Depends on: I001
      
      ## 备注
      
      Module 建议：GitHub Workflow。现有模板不得删除；如需新增字段，应单独评审。
      
      ---
  - id: "I003"
    title: "完善 CI 与 GitHub Pages 发布检查"
    epic: "Epic 1：项目初始化与 GitHub 工程规范"
    priority: "priority: p1"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: ci"
      - "priority: p1"
      - "area: project"
    depends_on: ["I001", "I002"]
    template: "task"
    body: |
      ## 背景
      
      CI 是 PR 合并和课程展示稳定性的基础，GitHub Pages 可用于发布静态文档或前端演示构建。
      
      ## 目标
      
      完善 GitHub Actions，使后端、前端、SQL 初始化和可选 Pages 构建都能在 PR 中被检查。
      
      ## 任务清单
      
      - [ ] 扩展 `.github/workflows/ci.yml`，覆盖 Ruff、后端 smoke、前端 lint/build、PostgreSQL SQL 初始化。
      - [ ] 增加 GitHub Pages 构建建议或独立 workflow，明确发布源和限制。
      - [ ] 在 `docs/12-github-workflow.md` 中写明 CI 失败时的处理流程。
      
      ## 涉及文件
      
      - `.github/workflows/ci.yml`
      - `frontend/package.json`
      - `backend/requirements.txt`
      - `docs/12-github-workflow.md`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      - `GET /api/health`
      
      ## 验收标准
      
      - [ ] PR 触发后端、前端和数据库基础检查。
      - [ ] CI 能执行 `database/00_init.sql` 到 `database/06_triggers.sql`。
      - [ ] GitHub Pages 发布方式有文档或 workflow 支持。
      
      ## 依赖关系
      
      Depends on: I001, I002
      
      ## 备注
      
      Module 建议：CI / Release。Pages 是 P1，不阻塞 P0 MVP。
      
      ---
  - id: "I004"
    title: "提供从 .github/issues.yaml 发布 Issues 的本地脚本"
    epic: "Epic 1：项目初始化与 GitHub 工程规范"
    priority: "priority: p1"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: chore"
      - "priority: p1"
      - "area: project"
    depends_on: ["I002"]
    template: "task"
    body: |
      ## 背景
      
      本次拆分会生成 `.github/issues.yaml`，后续需要人工确认后再由脚本批量发布到 GitHub。
      
      ## 目标
      
      提供一个不会自动执行的本地发布脚本，用于读取结构化 YAML 并生成 `gh issue create` 命令预览。
      
      ## 任务清单
      
      - [ ] 编写 `scripts/create_github_issues.py` 或同等脚本，解析 `.github/issues.yaml`。
      - [ ] 默认只 dry-run 输出命令，不直接创建 Issue。
      - [ ] 在 README 或 `docs/14-initial-issues.md` 中说明使用前需要人工确认。
      
      ## 涉及文件
      
      - `.github/issues.yaml`
      - `scripts/create_github_issues.py`
      - `docs/14-initial-issues.md`
      - `README.md`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] 脚本能校验 id、title、labels、milestone、body 必填字段。
      - [ ] dry-run 输出可复制执行的 `gh issue create` 命令。
      - [ ] 默认路径不会调用 GitHub API 或创建真实 Issue。
      
      ## 依赖关系
      
      Depends on: I002
      
      ## 备注
      
      Module 建议：GitHub Automation。发布动作必须由人工显式确认后执行。
      
      ---
  - id: "I005"
    title: "校准项目总览与需求分析课程文档"
    epic: "Epic 2：需求分析与课程文档"
    priority: "priority: p0"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: docs"
      - "priority: p0"
      - "area: docs"
    depends_on: ["I001"]
    template: "task"
    body: |
      ## 背景
      
      项目总览和需求分析是课程报告、Issue 拆分和实现边界的共同依据，必须准确表达 MemoryBase 不是普通 RAG，而是数据库治理系统。
      
      ## 目标
      
      校准项目定位、角色、功能需求、非功能需求、P0/P1/P2 边界和演示闭环。
      
      ## 任务清单
      
      - [ ] 更新 `docs/00-project-overview.md`，明确 Source → Memory → Evidence → Revision/Audit → Wiki 主线。
      - [ ] 更新 `docs/01-requirements.md`，核对角色、功能表、非功能需求和不做内容。
      - [ ] 将 README 与 `docs/summary.md` 中的 P0/P1/P2 表述统一。
      
      ## 涉及文件
      
      - `README.md`
      - `docs/summary.md`
      - `docs/00-project-overview.md`
      - `docs/01-requirements.md`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] 文档明确 P0 不依赖 LLM。
      - [ ] 角色和功能需求能映射到数据表、API 或页面。
      - [ ] 演示闭环包含 6 份 source、20 条 memory、evidence、recall、revision、audit、3 个 Wiki 页面。
      
      ## 依赖关系
      
      Depends on: I001
      
      ## 备注
      
      Module 建议：Documentation / Requirements。
      
      ---
  - id: "I006"
    title: "补齐数据流图与数据字典文档"
    epic: "Epic 2：需求分析与课程文档"
    priority: "priority: p0"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: docs"
      - "priority: p0"
      - "area: docs"
    depends_on: ["I005"]
    template: "task"
    body: |
      ## 背景
      
      数据库课程要求展示数据流、数据项、数据结构、数据存储和处理过程，MemoryBase 的导入、召回、导出链路需要清晰说明。
      
      ## 目标
      
      完善 DFD 与数据字典，使后续表结构、API 和测试能按同一术语实现。
      
      ## 任务清单
      
      - [ ] 在 `docs/02-data-flow.md` 中补齐 0 层、1 层、Source 导入、Recall、Wiki 导出数据流。
      - [ ] 在 `docs/03-data-dictionary.md` 中补齐核心数据项、数据结构、数据流和数据存储。
      - [ ] 核对字段名与 SQL schema 中的 `doc_id`、`chunk_id`、`memory_id`、`policy_id` 等一致。
      
      ## 涉及文件
      
      - `docs/02-data-flow.md`
      - `docs/03-data-dictionary.md`
      - `database/01_schema_core.sql`
      - `database/02_schema_memory.sql`
      - `database/03_schema_governance.sql`
      
      ## 涉及数据表
      
      - `source_document`
      - `source_chunk`
      - `memory_item`
      - `memory_evidence`
      - `recall_log`
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] 每个数据存储都能对应到至少一个数据库表。
      - [ ] Source 导入、Recall 检索、Wiki 导出都有 2 层 DFD。
      - [ ] 数据字典中的约束和枚举值与 SQL CHECK 约束一致。
      
      ## 依赖关系
      
      Depends on: I005
      
      ## 备注
      
      Module 建议：Documentation / Data Flow。
      
      ---
  - id: "I007"
    title: "完善 E-R、逻辑结构与物理结构设计文档"
    epic: "Epic 2：需求分析与课程文档"
    priority: "priority: p0"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: docs"
      - "priority: p0"
      - "area: database"
      - "area: docs"
    depends_on: ["I005", "I006"]
    template: "task"
    body: |
      ## 背景
      
      项目评分需要体现概念结构设计、E-R 到关系模型转换、3NF 分析、索引和存储安排。
      
      ## 目标
      
      将 E-R 图、关系模式和物理结构与实际 SQL 文件对齐。
      
      ## 任务清单
      
      - [ ] 更新 `docs/04-er-design.md`，确认实体、属性、联系和基数。
      - [ ] 更新 `docs/05-logical-design.md`，列出关系模式、PK、FK、UNIQUE、CHECK 和 M:N 中间表。
      - [ ] 更新 `docs/06-physical-design.md`，说明 PostgreSQL、索引策略、路径和备份恢复。
      
      ## 涉及文件
      
      - `docs/04-er-design.md`
      - `docs/05-logical-design.md`
      - `docs/06-physical-design.md`
      - `database/*.sql`
      
      ## 涉及数据表
      
      - `workspace`
      - `source_document`
      - `source_chunk`
      - `memory_item`
      - `memory_evidence`
      - `memory_revision`
      - `wiki_page`
      - `audit_log`
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] E-R 图覆盖 Source、Memory、Evidence、Governance、Wiki 五层。
      - [ ] M:N 关系通过 `memory_evidence`、`workspace_member` 等中间表说明。
      - [ ] 物理设计说明索引、全文检索、视图、触发器和软删除策略。
      
      ## 依赖关系
      
      Depends on: I005, I006
      
