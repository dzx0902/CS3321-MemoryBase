  - id: "I009"
    title: "实现 core schema：用户、工作区、Agent 与成员关系"
    epic: "Epic 3：数据库 Schema 与 SQL 基础"
    priority: "priority: p0"
    milestone: "M2 - Database Schema & SQL Foundation"
    labels:
      - "type: task"
      - "type: database"
      - "priority: p0"
      - "area: database"
    depends_on: ["I001"]
    template: "task"
    body: |
      ## 背景
      
      Workspace、用户、Agent 和成员关系是所有 Source、Memory、Policy 与 Audit 数据的归属基础。
      
      ## 目标
      
      完成 core schema，体现主键、外键、UNIQUE、CHECK 与 M:N 成员关系。
      
      ## 任务清单
      
      - [ ] 实现或校准 `user_account`、`workspace`、`agent`、`workspace_member`。
      - [ ] 为角色、scope、agent status、member_role 增加 CHECK 约束。
      - [ ] 确认 `workspace_member` 使用复合主键表示用户/Agent 与 workspace 的 M:N 关系。
      
      ## 涉及文件
      
      - `database/00_init.sql`
      - `database/01_schema_core.sql`
      - `docs/05-logical-design.md`
      
      ## 涉及数据表
      
      - `user_account`
      - `workspace`
      - `agent`
      - `workspace_member`
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] SQL 可在空 PostgreSQL 数据库重复执行。
      - [ ] 四张表都有主键，关键引用有外键。
      - [ ] 约束覆盖角色、scope、Agent 类型和状态。
      
      ## 依赖关系
      
      Depends on: I001
      
      ## 备注
      
      Module 建议：Database / Core Schema。
      
      ---
  - id: "I010"
    title: "实现 Source / Session / Message / Chunk schema"
    epic: "Epic 3：数据库 Schema 与 SQL 基础"
    priority: "priority: p0"
    milestone: "M2 - Database Schema & SQL Foundation"
    labels:
      - "type: task"
      - "type: database"
      - "priority: p0"
      - "area: source"
      - "area: database"
    depends_on: ["I009"]
    template: "task"
    body: |
      ## 背景
      
      SourceDocument 和 SourceChunk 是 MemoryBase 的原始证据层，必须保留 checksum、原文、chunk 顺序和行号。
      
      ## 目标
      
      完成会话、消息、源文档和 chunk schema，为导入、追溯和全文检索提供表结构。
      
      ## 任务清单
      
      - [ ] 实现或校准 `agent_session`、`message`、`source_document`、`source_chunk`。
      - [ ] 在 `source_document` 增加 checksum 唯一约束，避免重复导入。
      - [ ] 在 `source_chunk` 保存 `chunk_no`、`start_line`、`end_line`、`token_count` 和 `search_vector`。
      
      ## 涉及文件
      
      - `database/02_schema_memory.sql`
      - `docs/03-data-dictionary.md`
      - `docs/06-physical-design.md`
      
      ## 涉及数据表
      
      - `agent_session`
      - `message`
      - `source_document`
      - `source_chunk`
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] `source_chunk` 对 `(doc_id, chunk_no)` 有 UNIQUE 约束。
      - [ ] 删除 source document 时 chunk 删除策略清晰。
      - [ ] `search_vector` 可用于 PostgreSQL 全文检索。
      
      ## 依赖关系
      
      Depends on: I009
      
      ## 备注
      
      Module 建议：Database / Source Schema。
      
      ---
  - id: "I011"
    title: "实现 Memory / Evidence / Revision schema"
    epic: "Epic 3：数据库 Schema 与 SQL 基础"
    priority: "priority: p0"
    milestone: "M2 - Database Schema & SQL Foundation"
    labels:
      - "type: task"
      - "type: database"
      - "priority: p0"
      - "area: memory"
      - "area: evidence"
    depends_on: ["I009", "I010"]
    template: "task"
    body: |
      ## 背景
      
      MemoryItem、MemoryEvidence、MemoryRevision 构成 P0 可追溯、可版本化记忆闭环。
      
      ## 目标
      
      完成 memory 核心表，确保每条 memory 能绑定 source chunk 并产生 revision。
      
      ## 任务清单
      
      - [ ] 实现或校准 `memory_item`、`memory_revision`、`memory_evidence`。
      - [ ] 为 memory type、status、access level、confidence、importance 加 CHECK 约束。
      - [ ] 用 `memory_evidence` 表达 SourceChunk 与 MemoryItem 的 M:N 来源关系。
      
      ## 涉及文件
      
      - `database/02_schema_memory.sql`
      - `docs/05-logical-design.md`
      - `docs/10-test-plan.md`
      
      ## 涉及数据表
      
      - `memory_item`
      - `memory_revision`
      - `memory_evidence`
      
      ## 涉及 API
      
      无。
      
      ## 验收标准
      
      - [ ] `memory_revision` 使用 `(memory_id, revision_no)` 复合主键。
      - [ ] `memory_evidence` 防止同一 memory/chunk/role 重复绑定。
      - [ ] `memory_item.status` 支持 active、archived、forgotten、superseded、conflicted。
      
      ## 依赖关系
      
      Depends on: I009, I010
      
      ## 备注
      
      Module 建议：Database / Memory Schema。
      
      ---
