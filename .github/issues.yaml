      Module 建议：Database Design。
      
      ---
  - id: "I008"
    title: "同步架构、API、IPO、测试、演示与报告文档"
    epic: "Epic 2：需求分析与课程文档"
    priority: "priority: p1"
    milestone: "M1 - Project Setup & Documentation"
    labels:
      - "type: task"
      - "type: docs"
      - "priority: p1"
      - "area: docs"
    depends_on: ["I005", "I007"]
    template: "task"
    body: |
      ## 背景
      
      系统架构、API、模块 IPO、测试计划、演示脚本和最终报告需要和实际 backlog 同步，避免后续实现与报告脱节。
      
      ## 目标
      
      更新 `docs/07` 到 `docs/13`，形成可交付的课程文档闭环。
      
      ## 任务清单
      
      - [ ] 校准架构图、模块边界和后端/前端目录建议。
      - [ ] 校准 API 设计、IPO 表、测试用例、演示步骤和最终报告目录。
      - [ ] 在测试计划中覆盖 Source、Memory、Recall、Wiki、Audit、Policy 关键用例。
      
      ## 涉及文件
      
      - `docs/07-system-architecture.md`
      - `docs/08-api-design.md`
      - `docs/09-module-ipo.md`
      - `docs/10-test-plan.md`
      - `docs/11-demo-script.md`
      - `docs/13-final-report-outline.md`
      
      ## 涉及数据表
      
      无。
      
      ## 涉及 API
      
      - `POST /api/sources`
      - `POST /api/memories`
      - `POST /api/recall`
      - `POST /api/wiki/export`
      - `GET /api/audit`
      
      ## 验收标准
      
      - [ ] API 文档列出请求、响应和关键查询参数。
      - [ ] IPO 表每个模块都能对应到表和 API。
      - [ ] 演示脚本能在 5-8 分钟内覆盖数据库能力亮点。
      
      ## 依赖关系
      
      Depends on: I005, I007
      
      ## 备注
      
      Module 建议：Documentation / Report。
      
