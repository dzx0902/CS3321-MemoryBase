name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d docs
          test -d database
          test -f database/00_init.sql
          test -f database/01_schema_core.sql
          test -d backend
          test -f backend/requirements.txt
          test -f backend/app/main.py
          test -d frontend
          test -f frontend/package.json
          test -f frontend/index.html
          test -f frontend/src/main.jsx

  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        run: ruff check backend
      - name: Install frontend lint dependencies
        working-directory: frontend
        run: npm install --include=dev
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  database-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: memorybase_db
          POSTGRES_USER: memorybase
          POSTGRES_PASSWORD: memorybase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorybase -d memorybase_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply SQL files
        env:
          PGPASSWORD: memorybase
        run: |
          psql -h localhost -U memorybase -d memorybase_db -f database/00_init.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/01_schema_core.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/02_schema_memory.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/03_schema_governance.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/04_indexes.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/05_views.sql
          psql -h localhost -U memorybase -d memorybase_db -f database/06_triggers.sql
      - name: Smoke check tables
        env:
          PGPASSWORD: memorybase
        run: |
          psql -h localhost -U memorybase -d memorybase_db -c "\dt"

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend source
        run: python -m compileall backend
      - name: Import app object
        run: |
          PYTHONPATH=. python -c "from backend.app.main import app; print(app.title)"
      - name: Run backend smoke test
        run: |
          PYTHONPATH=. uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5
          curl --fail http://127.0.0.1:8000/api/health
          kill $SERVER_PID

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev
      - name: Build frontend
        working-directory: frontend
        run: npm run build
