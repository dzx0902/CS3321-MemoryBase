name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d docs
          test -d database
          test -f database/00_init.sql
          test -f database/01_schema_core.sql
          test -d backend
          test -f backend/requirements.txt
          test -f backend/app/main.py
          test -d frontend
          test -f frontend/package.json
          test -f frontend/index.html
          test -f frontend/src/main.jsx

  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Run Ruff
        run: ruff check backend
      - name: Install frontend lint dependencies
        working-directory: frontend
        run: npm install --include=dev
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Compile backend source
        run: python -m compileall backend
      - name: Import app object
        run: |
          PYTHONPATH=. python -c "from backend.app.main import app; print(app.title)"
      - name: Run backend smoke test
        run: |
          PYTHONPATH=. uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          sleep 5
          curl --fail http://127.0.0.1:8000/api/health
          kill $SERVER_PID

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --include=dev
      - name: Build frontend
        working-directory: frontend
        run: npm run build
