[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memorybase"
version = "0.1.0"
description = "CLI-first provenance memory runtime for agent collaboration."
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "psycopg[binary]",
  "pydantic",
  "python-dotenv",
  "httpx",
  "jieba",
  "tiktoken",
  "typer>=0.12",
]

[project.scripts]
memorybase = "app.cli.main:app"
mb = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
